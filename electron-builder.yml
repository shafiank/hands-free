# electron-builder.yml
# Hands Free v7.1.0 â€” Production Build Configuration
# Docs: https://www.electron.build/configuration/configuration

appId: app.handsfree.desktop
productName: Hands Free
copyright: Copyright Â© 2026 Hands Free

# â”€â”€ Compression â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# 'normal' = faster install on Windows (vs. default 'maximum' which is very slow).
# Mac DMG is unaffected â€” already fast regardless of this setting.
compression: normal

# â”€â”€ Directories â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
directories:
  output: dist
  buildResources: electron/icons

# â”€â”€ Files packed into the ASAR archive â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# Next.js is built with `output: 'standalone'` before packaging.
# Run: cd apps/web && npm run build
files:
  - electron/**/*
  - "apps/web/.next/standalone/**/*"
  - "apps/web/.next/standalone/node_modules/**/*"
  - "apps/web/.next/static/**/*"
  - "apps/web/public/**/*"
  - "apps/web/package.json"
  # â”€â”€ Bot scripts â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Always ship the source files as a safe fallback (needed in dev mode and
  # when bundle:bots hasn't been run yet). If telegram-bot.bundled.js exists
  # (generated by `npm run bundle:bots`), telegram.ts prefers it at runtime.
  - "apps/web/telegram-bot.js"
  - "apps/web/discord-bot.js"
  - "apps/web/whatsapp-bot.js"
  # â”€â”€ Bundled bots (self-contained, generated by `npm run bundle:bots`) â”€â”€â”€â”€
  # When present these replace the source files â€” no node_modules needed.
  # Electron-builder silently skips these if they don't exist (safe to omit).
  - "apps/web/telegram-bot.bundled.js"
  - "apps/web/discord-bot.bundled.js"
  - "!.handsfree-data"
  - "!**/*.map"

# â”€â”€ ASAR unpack â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# The standalone server.js and static assets must exist as real files on disk
# (not inside the ASAR virtual filesystem) so that `spawn(process.execPath, [serverPath])`
# can actually execute them. These paths are mirrored to app.asar.unpacked/.
asarUnpack:
  - "apps/web/.next/standalone/**/*"
  - "apps/web/.next/standalone/node_modules/**/*"
  - "apps/web/.next/static/**/*"
  - "apps/web/public/**/*"
  # Bot scripts must be real files so spawn('node', [path]) can execute them
  - "apps/web/telegram-bot.js"
  - "apps/web/discord-bot.js"
  - "apps/web/whatsapp-bot.js"
  - "apps/web/telegram-bot.bundled.js"
  - "apps/web/discord-bot.bundled.js"

# â”€â”€ Auto-update â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# electron-builder generates `latest.yml` (Windows) / `latest-mac.yml` (macOS)
# alongside the installer. Upload BOTH to the URL below after each build.
# electron-updater checks this URL on startup and every 4 hours.
publish:
  provider: generic
  url: https://handsfree.app/updates/

# â”€â”€ Windows â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
win:
  artifactName: "Hands-Free-Setup-${version}.${ext}"
  target:
    - target: nsis
      arch: [x64]
  icon: electron/icons/icon.ico
  # Code signing â€” set in CI: CSC_LINK, CSC_KEY_PASSWORD
  # â”€â”€ Windows extra resources: single archive for fast NSIS install â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # NSIS writes files one-by-one. ~50 000 files = 3-5 min.
  # ONE tar.gz file = ~15-20 sec install.
  # Created by `npm run pack:deps` before packaging.
  # Extracted by electron/main.js at first launch (~15-20 sec, shown in splash).
  extraResources:
    - from: apps/web/node_modules.tar.gz
      to: apps/web/node_modules.tar.gz

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  # Override the registry display name so "Programs and Features" shows
  # "Hands Free" instead of "Hands Free 6.0.0". The version is still recorded in
  # the DisplayVersion registry key â€” only the DisplayName is affected.
  uninstallDisplayName: Hands Free
  installerIcon: electron/icons/icon.ico
  uninstallerIcon: electron/icons/icon.ico
  installerHeaderIcon: electron/icons/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Hands Free

# â”€â”€ macOS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
mac:
  artifactName: "Hands-Free-${version}-${arch}.${ext}"
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: electron/icons/icon.icns
  category: public.app-category.productivity
  # â”€â”€ macOS extra resources: full node_modules folder â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # DMG drag-and-drop install is fast regardless of file count (~15-20 sec).
  extraResources:
    - from: apps/web/node_modules
      to: apps/web/node_modules
      filter:
        - "**/*"
        - "!.cache/**"
  # Code signing â€” set in CI: APPLE_ID, APPLE_ID_PASSWORD, APPLE_TEAM_ID,
  # CSC_LINK, CSC_KEY_PASSWORD
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  # â”€â”€ Info.plist additions â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # These keys are merged into the generated Info.plist inside the .app bundle.
  extendInfo:
    NSHumanReadableCopyright: "Copyright Â© 2026 Hands Free. All rights reserved."
    CFBundleShortVersionString: "7.1.0"
    CFBundleVersion: "7.1.0"
    # Required for Login Items (auto-launch) via SMLoginItemSetEnabled / LSUIElement
    LSUIElement: false
    # Declare usage descriptions required by macOS privacy prompts
    NSMicrophoneUsageDescription: "Hands Free uses the microphone for voice input."
    NSCameraUsageDescription: "Hands Free does not use the camera."
    # Disable App Transport Security for local-only HTTP server on localhost
    NSAppTransportSecurity:
      NSAllowsLocalNetworking: true

# â”€â”€ Linux â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
linux:
  artifactName: "Hands-Free-${version}-${arch}.${ext}"
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Utility
  icon: electron/icons
  desktop:
    Name: Hands Free
    Comment: Local-first AI desktop agent
    Categories: Utility;Development;
  extraResources:
    - from: apps/web/node_modules
      to: apps/web/node_modules
      filter:
        - "**/*"
        - "!.cache/**"

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
